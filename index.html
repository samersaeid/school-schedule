<style>

body{margin:0;background:var(--bg);color:var(--ink);font-family:'Tajawal',Tahoma,sans-serif;min-height:100vh}
header{background:linear-gradient(135deg,#064e3b,#047857);color:#fff;padding:24px 16px 16px}

h1{margin:0;font-size:1.6rem;font-weight:800}
.sub{opacity:.85;font-size:.9rem;margin-top:4px}
.tools{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}

main{padding:24px 16px}

.sr .go{color:var(--brand);font-weight:700;white-space:nowrap}
.empty{text-align:center;color:var(--mute);padding:48px 0;display:none}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;padding:12px;z-index:10}
.ov.show{display:flex}
.modal{background:var(--card);border-radius:20px;width:100%;max-width:1000px;max-height:92vh;display:flex;flex-direction:column;overflow:hidden}
.mh{background:var(--brand-d);color:#fff;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.mh h2{margin:0;font-size:1.15rem}
.mh small{opacity:.8}
.mh button{background:rgba(255,255,255,.15);border:0;color:#fff;border-radius:10px;padding:8px 12px;cursor:pointer;font:inherit}
.mt{display:flex;border-bottom:1px solid var(--line)}
.mt button{flex:1;padding:12px;border:0;background:none;color:var(--mute);font:inherit;font-weight:700;cursor:pointer;border-bottom:3px solid transparent}
.mt button.on{color:var(--brand);border-bottom-color:var(--brand)}
.mb{padding:16px;overflow:auto}
table{width:100%;border-collapse:collapse;text-align:center;font-size:.82rem;min-width:760px}
th,td{border:1px solid var(--line);padding:8px 4px}
th{background:var(--brand-l);color:var(--brand)}
th small{display:block;font-weight:400;color:var(--mute);font-size:.68rem}
td b{display:block}td span{color:var(--mute);font-size:.72rem}
.brk{background:#fef3c7;color:#92400e;font-weight:700}
.dy{background:var(--brand-l);font-weight:700}
ol.st{columns:2 220px;column-gap:28px;padding-inline-start:28px;margin:0;line-height:2}
textarea{width:100%;height:260px;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font:inherit}

.row .btn{flex:none;padding:9px 16px}
.hint{font-size:.8rem;color:var(--mute);margin:0 0 8px}
.ph{display:none}
footer{text-align:center;color:var(--mute);font-size:.8rem;padding:20px}

</style>
</head>

  const out=[];
  data.forEach(c=>(c.students||[]).forEach((s,i)=>{const n=nz(s);if(w.every(x=>n.includes(x)))out.push({id:c.id,i,s,c})}));
  return out;
}
function render(){
  renderTabs();
  const q=document.getElementById('q').value.trim();
  const list=data.filter(c=>(flt==='all'||c.grade===flt)&&(c.name+' '+Object.values(c.schedule||{}).flat().map(x=>x[1]||'').join(' ')).includes(q));
  const sm=findStudents(q);
  const sres=document.getElementById('sres');
  sres.innerHTML=sm.length?`<div class="sr"><h2>👩‍🎓 نتائج الطالبات (${sm.length}${sm.length>40?' — أول 40':''})</h2>`+sm.slice(0,40).map(m=>`<button data-id="${m.id}" data-i="${m.i}"><span>${esc(m.s)}<small>الصف ${gn[m.c.grade]||m.c.grade} الثانوي • ${esc(m.c.name)}</small></span><span class="go">عرض الجدول ›</span></button>`).join('')+'</div>':'';
  document.getElementById('empty').style.display=(list.length||sm.length)?'none':'block';
  document.getElementById('grid').innerHTML=list.map(c=>`
   <div class="card">
    <div style="display:flex;justify-content:space-between"><span class="badge">الصف ${gn[c.grade]||c.grade}</span><span class="meta">🚪 ${esc(c.room)}</span></div>
    <h3>${esc(c.name)}</h3>
    <div class="meta">👩‍🎓 الطالبات: ${(c.students||[]).length||'—'}</div>
    <div class="btns"><button class="btn" onclick="openM(${c.id},1)">📅 الجدول</button><button class="btn" onclick="openM(${c.id},2)">👩‍🎓 الطالبات</button></div>
   </div>`).join('');
}
function openM(id,t,stu){
  cur=data.find(c=>c.id===id);if(!cur)return;
  document.getElementById('mt').textContent=cur.name;
  document.getElementById('ms').textContent=stu?('👩‍🎓 الطالبة: '+stu):cur.room;
  document.getElementById('tb').innerHTML=days.map(d=>`<tr><td class="dy">${d}</td>`+[0,1,2,3,4,5,6].map(i=>{
    const it=(cur.schedule&&cur.schedule[d]&&cur.schedule[d][i])||null;
    if(!it)return'<td>—</td>';
    if(it[0]==='الراحة')return'<td class="brk">الراحة</td>';
    return`<td><b>${esc(it[0])}</b><span>${esc(it[1]||'')}</span></td>`}).join('')+'</tr>').join('');
  drawStudents();
  document.getElementById('ov').classList.add('show');document.body.style.overflow='hidden';
  tab(t);
}
function tab(t){
  document.getElementById('p1').style.display=t===1?'':'none';
  document.getElementById('p2').style.display=t===2?'':'none';
  document.getElementById('t1').className=t===1?'on':'';
  document.getElementById('t2').className=t===2?'on':'';
  document.getElementById('pt').textContent=(t===1?'جدول الحصص — ':'قائمة الطالبات — ')+cur.name;
}
function drawStudents(){
  const s=cur.students||[];
  document.getElementById('sv').innerHTML=s.length
    ?`<p class="hint">العدد: ${s.length}</p><ol class="st">${s.map(x=>`<li>${esc(x)}</li>`).join('')}</ol>`
    :'<p class="hint">لم تُضف أسماء لهذا الفصل بعد.</p>';
}
function closeM(){document.getElementById('ov').classList.remove('show');document.body.style.overflow=''}
document.getElementById('q').addEventListener('input',render);
document.getElementById('sres').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const c=data.find(x=>x.id==b.dataset.id);openM(c.id,1,c.students[b.dataset.i]);});
load();render();
</script>
</body>
</html>
